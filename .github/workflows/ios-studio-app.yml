name: iOS studio app

# This repository is one Windows application, so every change builds it: the
# packaged copy has to start its panel, answer for itself with `--verify`, and
# produce an installer. A Windows runner is the only place that can be proved,
# which is why this project lives outside the repository whose Linux CI could
# never have caught an asar path or the ELECTRON_RUN_AS_NODE hand-off breaking.
#
# A push to main goes one step further and publishes that installer as a GitHub
# release tagged with the package version, so the file a user downloads is one a
# runner started and verified rather than one built on someone's machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read by default; only the release job is given the right to write, below.
permissions:
  contents: read

concurrency:
  group: ios-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and smoke-test the app
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      # Before anything is downloaded: what the shortcut points at is a decision
      # worth testing, and testing it costs no dependencies.
      - name: Run the shortcut's tests
        run: npm test

      - name: Install the build dependencies
        run: npm ci --no-audit --no-fund

      # The icon is code, so it can fail. Running it here also proves the `.ico`
      # the packager is about to read exists and parses.
      - name: Draw the icon
        run: node build-icon.mjs

      # One build produces both the unpacked app and the installer.
      - name: Package the app and the installer
        run: node build-installer.mjs

      # The app refuses to invent a project folder — it drives an iOS checkout,
      # and this repository is only the shell. So the smoke test hands it one:
      # a package.json, an `ios/` folder, and an `ios/studio.json` naming the app,
      # so the run exercises the config path as well as the start-up. Nothing
      # runs from it; `--verify` only asks the panel what it sees.
      - name: Build a checkout for the app to open
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .verify-project/ios | Out-Null
          '{ "name": "checkout-fixture", "private": true }' | Set-Content .verify-project/package.json
          '{ "appName": "FixtureApp", "bundleId": "com.example.fixture" }' | Set-Content .verify-project/ios/studio.json

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/iOS studio.exe'
          if (-not (Test-Path $exe)) { throw 'no packaged executable was produced' }
          $report = Join-Path $PWD 'verify-report.json'
          # `Start-Process -Wait -PassThru` rather than `& $exe`: the app is a
          # GUI-subsystem executable, so calling it directly returns at once and
          # leaves $LASTEXITCODE unset — a check against that empty value fails
          # on every run, whatever the app answered. Its output goes to a file
          # for the same reason: started this way it inherits no console, and a
          # report nobody can read leaves only an exit code as evidence.
          $app = Start-Process -FilePath (Resolve-Path $exe) `
            -ArgumentList '--verify', '--root=.verify-project' `
            -Wait -PassThru -RedirectStandardOutput $report
          if (Test-Path $report) { Get-Content $report -Tail 40 }
          # The app writes why it failed into the profile it ran under.
          $log = Join-Path $env:APPDATA 'iOS studio/logs/main.log'
          if (Test-Path $log) { Get-Content $log -Tail 20 }
          if ($app.ExitCode -ne 0) {
            throw "the packaged app did not answer its panel (exit $($app.ExitCode))"
          }
          # A green run that cannot say which app it opened proves less than it
          # looks: the name has to come from the checkout, not from this app.
          if (-not (Select-String -Path $report -Pattern '"app": "FixtureApp"' -Quiet)) {
            throw 'the packaged app did not read the app name from ios/studio.json'
          }
          'the packaged app served the panel and read the app from the checkout'

      - name: Check the installer was produced
        shell: pwsh
        run: |
          # The packager's own uninstaller stub carries "Setup" in its name while
          # the build runs, so it is excluded explicitly: a check that passed on
          # the uninstaller would report an installer that is not one.
          $installer = Get-ChildItem 'release/*.exe' |
            Where-Object { $_.Name -like '*Setup*' -and $_.Name -notlike '*uninstaller*' } |
            Select-Object -First 1
          if (-not $installer) { throw 'no installer was produced' }
          '{0} ({1:N1} MiB)' -f $installer.Name, ($installer.Length / 1MB)
          # Copied out under its own name so the release job uploads one known
          # file: the packager keeps working files in `release/`, and a glob
          # there could pick up a second executable later.
          New-Item -ItemType Directory -Force release-asset | Out-Null
          Copy-Item $installer.FullName release-asset/

      # The installer crosses to the release job as a build artifact, so what
      # gets published is the file this job just smoke-tested, not a second
      # build of the same commit that could differ from it.
      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: release-asset/*.exe
          if-no-files-found: error
          retention-days: 14

  # Publishing is a separate job so the packaging job needs no write access to
  # this repository — and gets none.
  release:
    name: Publish the installer as a release
    needs: package
    # A pull request is built to be checked, not to be published. Pushing to
    # main is the release; a manual run of this workflow is the way to ship
    # again without an empty commit.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer
          path: dist

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The tag *is* the package version, so a release cannot claim a
          # version the app does not report.
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          asset=$(ls dist/*.exe)
          if gh release view "$tag" > /dev/null 2>&1; then
            # A second push on the same version replaces the asset instead of
            # failing: the release is one per version, not one per commit.
            echo "release $tag already exists: replacing its installer"
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "iOS studio $version" \
              --generate-notes
          fi
          # Read the result back: the upload's exit code says what was sent, not
          # what the release now holds.
          echo "published $(basename "$asset") to $tag"
          gh release view "$tag" --json url,assets --jq '"url: " + .url, (.assets[] | "asset: " + .name + " (" + (.size|tostring) + " bytes)")'
